<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c0392b">
<title>Mis Tareas</title>
<style>
:root{--rojo:#c0392b;--rojo-claro:#fdecea;--texto:#2b2b2b;--gris:#8a8a8a;--fondo:#faf7f6;--tarjeta:#ffffff;--borde:#eee}
.oscuro{--texto:#f0f0f0;--gris:#a0a0a0;--fondo:#1c1b1b;--tarjeta:#2a2828;--borde:#3a3737;--rojo-claro:#3a2523}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,Helvetica,Arial,sans-serif;background:var(--fondo);color:var(--texto);padding-bottom:80px}
header{background:var(--rojo);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px;display:flex;justify-content:space-between;align-items:center}
#frase{font-size:13px;opacity:.92;margin-top:6px;font-style:italic}
.barra{height:8px;background:rgba(255,255,255,.3);border-radius:8px;margin-top:10px;overflow:hidden}
.barra div{height:100%;width:0;background:#fff;transition:width .4s}
#pct{font-size:12px;margin-top:4px}
nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--tarjeta);border-top:1px solid var(--borde);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:12px 4px;font-size:12px;color:var(--gris)}
nav button.act{color:var(--rojo);font-weight:700}
section{display:none;padding:14px}
section.act{display:block}
.dias{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.dias button{flex:0 0 auto;border:1px solid var(--borde);background:var(--tarjeta);color:var(--texto);border-radius:20px;padding:8px 14px;font-size:14px}
.dias button.act{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:12px;margin:10px 0}
.tarea{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--borde)}
.tarea:last-child{border-bottom:0}
.tarea input[type=checkbox]{width:22px;height:22px;accent-color:var(--rojo);margin-top:2px}
.tarea .t{flex:1}
.tarea .t b{display:block;font-weight:600}
.tarea .t small{color:var(--gris)}
.tarea.hecha .t b{text-decoration:line-through;color:var(--gris)}
.p1{border-left:4px solid #e74c3c;padding-left:8px}
.p2{border-left:4px solid #f39c12;padding-left:8px}
.p3{border-left:4px solid #3498db;padding-left:8px}
.x{border:0;background:none;color:var(--gris);font-size:18px}
input[type=text],input[type=time],select{width:100%;padding:11px;border:1px solid var(--borde);border-radius:10px;font-size:16px;background:var(--tarjeta);color:var(--texto);margin:4px 0}
.fila{display:flex;gap:8px}
.btn{background:var(--rojo);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:15px;width:100%;margin-top:6px}
.btn.sec{background:var(--rojo-claro);color:var(--rojo)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips label{border:1px solid var(--borde);border-radius:16px;padding:6px 10px;font-size:13px}
.chips input{display:none}
.chips input:checked+span{color:var(--rojo);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:10px;table-layout:fixed}
th,td{border:1px solid var(--borde);padding:2px;height:22px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
th{background:var(--rojo-claro);color:var(--rojo)}
td.h{width:30px;text-align:center;color:var(--gris)}
td.ocu{background:var(--rojo);color:#fff}
.temp{font-size:56px;text-align:center;font-weight:700;margin:20px 0;color:var(--rojo)}
.racha{color:var(--rojo);font-weight:700;font-size:13px}
.vacio{text-align:center;color:var(--gris);padding:24px}
</style>
</head>
<body>
<header>
<h1><span>Mis Tareas</span><button class="x" style="color:#fff" onclick="tema()">☾</button></h1>
<div id="frase"></div>
<div class="barra"><div id="prog"></div></div>
<div id="pct"></div>
</header>

<section id="s-hoy" class="act">
<div class="dias" id="dias"></div>
<div class="tarjeta">
<input type="text" id="rapida" placeholder="Añadir rápido: Estudiar 18:00" onkeydown="if(event.key==='Enter')rapida()">
<button class="btn" onclick="rapida()">Añadir</button>
</div>
<div id="lista"></div>
</section>

<section id="s-nueva">
<div class="tarjeta">
<h3>Nueva tarea</h3>
<input type="text" id="n-titulo" placeholder="¿Qué tienes que hacer?">
<div class="fila">
<input type="time" id="n-hora">
<select id="n-dur"><option value="1">1 h</option><option value="2">2 h</option><option value="3">3 h</option><option value="0.5">30 min</option></select>
</div>
<select id="n-prio"><option value="1">Prioridad alta</option><option value="2" selected>Prioridad media</option><option value="3">Prioridad baja</option></select>
<p style="margin:8px 0 2px;font-size:13px;color:var(--gris)">Se repite estos días:</p>
<div class="chips" id="n-dias"></div>
<input type="text" id="n-sub" placeholder="Subtareas separadas por coma (opcional)">
<button class="btn" onclick="crear()">Guardar tarea</button>
</div>
</section>

<section id="s-sem">
<div class="tarjeta" style="padding:6px"><div id="horario"></div></div>
</section>

<section id="s-hab">
<div class="tarjeta">
<input type="text" id="h-nombre" placeholder="Nuevo hábito: Beber agua">
<button class="btn" onclick="nuevoHabito()">Añadir hábito</button>
</div>
<div id="habitos"></div>
</section>

<section id="s-foco">
<div class="tarjeta">
<div class="temp" id="temp">25:00</div>
<div class="fila">
<button class="btn" onclick="foco(25)">Foco 25</button>
<button class="btn sec" onclick="foco(5)">Descanso 5</button>
<button class="btn sec" onclick="paraFoco()">Parar</button>
</div>
<p style="text-align:center;color:var(--gris);font-size:13px">Sesiones de foco hoy: <b id="sesiones">0</b></p>
</div>
<div class="tarjeta">
<button class="btn sec" onclick="avisos()">Activar avisos de recordatorio</button>
<p style="font-size:12px;color:var(--gris)">En iPhone los avisos solo funcionan con la página abierta. Para que funcionen mejor, añade la página a la pantalla de inicio.</p>
<button class="btn sec" onclick="exportar()">Copiar mis datos (copia de seguridad)</button>
<button class="btn sec" onclick="importar()">Pegar datos guardados</button>
</div>
</section>

<nav>
<button class="act" onclick="ir('hoy',this)">Hoy</button>
<button onclick="ir('nueva',this)">Nueva</button>
<button onclick="ir('sem',this)">Semana</button>
<button onclick="ir('hab',this)">Hábitos</button>
<button onclick="ir('foco',this)">Foco</button>
</nav>

<script>
const DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const FRASES=['Un paso pequeño hoy vale más que un plan perfecto mañana.','Hazlo simple, hazlo hoy.','La constancia le gana al talento.','Cada tarea hecha es una victoria.','Empieza donde estás, con lo que tienes.','Tu yo del futuro te lo agradecerá.','No tienes que hacerlo todo, solo lo siguiente.','Despacio también es avanzar.'];
let D=JSON.parse(localStorage.getItem('mt2')||'null')||{tareas:[],habitos:[],hechas:{},sesiones:{},oscuro:false};
let dia=new Date().getDay();
const guardar=()=>localStorage.setItem('mt2',JSON.stringify(D));
const hoyStr=()=>new Date().toISOString().slice(0,10);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function ir(id,b){document.querySelectorAll('section').forEach(s=>s.classList.remove('act'));document.getElementById('s-'+id).classList.add('act');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('act'));b.classList.add('act');if(id==='sem')pintaSemana();}
function tema(){D.oscuro=!D.oscuro;document.body.classList.toggle('oscuro',D.oscuro);guardar();}

function pintaDias(){const c=document.getElementById('dias');c.innerHTML='';const orden=[1,2,3,4,5,6,0];orden.forEach(i=>{const b=document.createElement('button');b.textContent=DIAS[i]+(i===new Date().getDay()?' •':'');if(i===dia)b.classList.add('act');b.onclick=()=>{dia=i;pintaDias();pintaLista();};c.appendChild(b);});}

function clave(t){return hoyStr()+'|'+t.id;}
function pintaLista(){
 const l=document.getElementById('lista');
 const ts=D.tareas.filter(t=>t.dias.includes(dia)).sort((a,b)=>(a.hora||'99').localeCompare(b.hora||'99')||a.prio-b.prio);
 if(!ts.length){l.innerHTML='<div class="vacio">Nada para este día. Añade una tarea arriba.</div>';}
 else{l.innerHTML='<div class="tarjeta">'+ts.map(t=>{
  const h=!!D.hechas[clave(t)];
  const subs=(t.subs||[]).map((s,i)=>'<label style="display:block;font-size:13px;margin:4px 0 0 4px"><input type="checkbox" '+(D.hechas[clave(t)+'#'+i]?'checked':'')+' onchange="marcaSub(\''+t.id+'\','+i+',this.checked)"> '+esc(s)+'</label>').join('');
  return '<div class="tarea p'+t.prio+(h?' hecha':'')+'"><input type="checkbox" '+(h?'checked':'')+' onchange="marca(\''+t.id+'\',this.checked)"><div class="t"><b>'+esc(t.titulo)+'</b><small>'+(t.hora?t.hora+' · ':'')+t.dias.map(d=>DIAS[d]).join(' ')+'</small>'+subs+'</div><button class="x" onclick="borra(\''+t.id+'\')">✕</button></div>';}).join('')+'</div>';}
 pintaAvance();
}
function marca(id,v){const t=D.tareas.find(x=>x.id===id);if(v)D.hechas[clave(t)]=1;else delete D.hechas[clave(t)];guardar();pintaLista();}
function marcaSub(id,i,v){const t=D.tareas.find(x=>x.id===id);const k=clave(t)+'#'+i;if(v)D.hechas[k]=1;else delete D.hechas[k];guardar();}
function borra(id){if(confirm('¿Borrar esta tarea?')){D.tareas=D.tareas.filter(t=>t.id!==id);guardar();pintaLista();}}
function pintaAvance(){
 const hoy=new Date().getDay();const ts=D.tareas.filter(t=>t.dias.includes(hoy));
 const hechas=ts.filter(t=>D.hechas[clave(t)]).length;
 const p=ts.length?Math.round(hechas/ts.length*100):0;
 document.getElementById('prog').style.width=p+'%';
 document.getElementById('pct').textContent='Hoy: '+hechas+' de '+ts.length+' tareas ('+p+'%)';
}
function rapida(){
 const i=document.getElementById('rapida');let txt=i.value.trim();if(!txt)return;
 const m=txt.match(/(\d{1,2}):(\d{2})/);let hora='';
 if(m){hora=m[1].padStart(2,'0')+':'+m[2];txt=txt.replace(m[0],'').trim();}
 D.tareas.push({id:'t'+Date.now(),titulo:txt,hora,dur:1,prio:2,dias:[dia],subs:[]});
 i.value='';guardar();pintaLista();
}
function crear(){
 const titulo=document.getElementById('n-titulo').value.trim();if(!titulo){alert('Escribe un título');return;}
 const dias=[...document.querySelectorAll('#n-dias input:checked')].map(x=>+x.value);
 if(!dias.length){alert('Elige al menos un día');return;}
 const subs=document.getElementById('n-sub').value.split(',').map(s=>s.trim()).filter(Boolean);
 D.tareas.push({id:'t'+Date.now(),titulo,hora:document.getElementById('n-hora').value,dur:+document.getElementById('n-dur').value,prio:+document.getElementById('n-prio').value,dias,subs});
 guardar();document.getElementById('n-titulo').value='';document.getElementById('n-sub').value='';
 pintaLista();ir('hoy',document.querySelector('nav button'));
}
function pintaChips(){const c=document.getElementById('n-dias');[1,2,3,4,5,6,0].forEach(i=>{const l=document.createElement('label');l.innerHTML='<input type="checkbox" value="'+i+'"><span>'+DIAS[i]+'</span>';c.appendChild(l);});}

function pintaSemana(){
 const orden=[1,2,3,4,5,6,0];
 let h='<table><tr><th class="h"></th>'+orden.map(i=>'<th>'+DIAS[i]+'</th>').join('')+'</tr>';
 for(let hr=0;hr<24;hr++){
  h+='<tr><td class="h">'+hr+'</td>';
  orden.forEach(d=>{
   const t=D.tareas.find(x=>x.dias.includes(d)&&x.hora&&(()=>{const ini=parseInt(x.hora);return hr>=ini&&hr<ini+Math.ceil(x.dur||1);})());
   h+=t?'<td class="ocu">'+esc(t.titulo)+'</td>':'<td></td>';
  });
  h+='</tr>';
 }
 document.getElementById('horario').innerHTML=h+'</table>';
}

function pintaHabitos(){
 const c=document.getElementById('habitos');
 if(!D.habitos.length){c.innerHTML='<div class="vacio">Aún no tienes hábitos.</div>';return;}
 c.innerHTML=D.habitos.map((h,i)=>{
  const hoy=hoyStr();const ok=h.dias.includes(hoy);
  let racha=0;const d=new Date();if(!ok)d.setDate(d.getDate()-1);
  while(h.dias.includes(d.toISOString().slice(0,10))){racha++;d.setDate(d.getDate()-1);}
  return '<div class="tarjeta tarea" style="align-items:center"><input type="checkbox" '+(ok?'checked':'')+' onchange="toggleHab('+i+')"><div class="t"><b>'+esc(h.nombre)+'</b><span class="racha">Racha: '+racha+' día'+(racha===1?'':'s')+'</span></div><button class="x" onclick="borraHab('+i+')">✕</button></div>';}).join('');
}
function nuevoHabito(){const i=document.getElementById('h-nombre');if(!i.value.trim())return;D.habitos.push({nombre:i.value.trim(),dias:[]});i.value='';guardar();pintaHabitos();}
function toggleHab(i){const h=D.habitos[i],t=hoyStr();const k=h.dias.indexOf(t);if(k>-1)h.dias.splice(k,1);else h.dias.push(t);guardar();pintaHabitos();}
function borraHab(i){if(confirm('¿Borrar hábito?')){D.habitos.splice(i,1);guardar();pintaHabitos();}}

let reloj=null,seg=0;
function pintaTemp(){document.getElementById('temp').textContent=String(Math.floor(seg/60)).padStart(2,'0')+':'+String(seg%60).padStart(2,'0');}
function foco(m){paraFoco();seg=m*60;pintaTemp();reloj=setInterval(()=>{seg--;pintaTemp();if(seg<=0){paraFoco();if(m===25){D.sesiones[hoyStr()]=(D.sesiones[hoyStr()]||0)+1;guardar();pintaSes();}aviso('¡Tiempo terminado!');if(navigator.vibrate)navigator.vibrate(400);}},1000);}
function paraFoco(){clearInterval(reloj);reloj=null;}
function pintaSes(){document.getElementById('sesiones').textContent=D.sesiones[hoyStr()]||0;}

function avisos(){if(!('Notification' in window)){alert('Tu navegador no permite avisos.');return;}Notification.requestPermission().then(p=>alert(p==='granted'?'Avisos activados':'Avisos no permitidos'));}
function aviso(t){if('Notification' in window&&Notification.permission==='granted'){new Notification('Mis Tareas',{body:t});}else{alert(t);}}
let avisadas={};
setInterval(()=>{const n=new Date();const hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
 D.tareas.filter(t=>t.hora===hm&&t.dias.includes(n.getDay())&&!D.hechas[clave(t)]).forEach(t=>{const k=clave(t)+hm;if(!avisadas[k]){avisadas[k]=1;aviso('Ahora: '+t.titulo);}});},20000);

function exportar(){const s=JSON.stringify(D);navigator.clipboard.writeText(s).then(()=>alert('Datos copiados. Pégalos en Notas para guardarlos.'));}
function importar(){const s=prompt('Pega aquí tus datos guardados:');if(!s)return;try{D=JSON.parse(s);guardar();location.reload();}catch(e){alert('Los datos no son válidos.');}}

document.getElementById('frase').textContent=FRASES[Math.floor(Math.random()*FRASES.length)];
if(D.oscuro)document.body.classList.add('oscuro');
pintaDias();pintaChips();pintaLista();pintaHabitos();pintaSes();
</script>
</body>
</html>
